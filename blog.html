<script>
// サーバーから記事を読み込む
const API_URL = 'api/articles.php';
let articles = [];
let currentCat = 'all';
let currentTag = '';

async function loadArticles(){
  try {
    const res = await fetch(API_URL + '?status=published');
    if(!res.ok) throw new Error(`API error: ${res.status}`);
    const data = await res.json();
    if(!data.success || !Array.isArray(data.articles) || !data.articles.length){
      throw new Error('API returned no published articles');
    }
    articles = data.articles;
    renderArticles(currentCat, currentTag);
    renderTagCloud();
  } catch(e) {
    // GitHubや静的プレビューでは公開JSONを使用する
    try {
      const fallbackRes = await fetch('data/articles.json');
      if(!fallbackRes.ok) throw new Error(`Fallback error: ${fallbackRes.status}`);
      const fallbackData = await fallbackRes.json();
      const fallbackArticles = Array.isArray(fallbackData) ? fallbackData : fallbackData.articles;
      if(!Array.isArray(fallbackArticles) || !fallbackArticles.length){
        throw new Error('Fallback returned no articles');
      }
      articles = fallbackArticles.filter(a=>!a.status || a.status==='published');
      renderArticles(currentCat, currentTag);
      renderTagCloud();
      return;
    } catch(fallbackError) {
      console.warn('記事APIと公開JSONを読み込めませんでした。', fallbackError);
    }
    // 最終フォールバック：最小サンプルデータ
    articles = [
  {
    id:'1',

  }
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// 記事本文は許可した要素・属性だけを残す（API/JSON由来HTMLのXSS対策）
function sanitizeArticleHTML(value){
  const allowedTags = new Set(['P','BR','H2','H3','H4','UL','OL','LI','STRONG','EM','B','I','BLOCKQUOTE','A','CODE','PRE','HR']);
  const doc = new DOMParser().parseFromString(`<div>${String(value ?? '')}</div>`, 'text/html');
  [...doc.body.querySelectorAll('*')].forEach(el=>{
    if(!allowedTags.has(el.tagName)){
      el.replaceWith(...el.childNodes);
      return;
    }
    const rawHref = el.tagName === 'A' ? (el.getAttribute('href') || '') : '';
    [...el.attributes].forEach(attr=>el.removeAttribute(attr.name));
    if(el.tagName === 'A'){
      try {
        const parsed = new URL(rawHref, window.location.href);
        if(!['http:','https:'].includes(parsed.protocol)) el.removeAttribute('href');
        else {
          el.setAttribute('href', parsed.href);
          el.setAttribute('target', '_blank');
          el.setAttribute('rel', 'noopener noreferrer');
        }
      } catch(e) { el.removeAttribute('href'); }
    }
  });
  return doc.body.firstElementChild?.innerHTML || '';
}

function safeImageUrl(value){
  const url = String(value ?? '').trim();
  if(!url) return '';
  if(url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) return url;
  try {
    const parsed = new URL(url, window.location.href);
    return parsed.protocol === 'https:' ? parsed.href : '';
  } catch(e) {
    return '';
  }
}

// タグクラウド描画
function renderTagCloud(){
  const tags = [...new Set(articles.map(a=>a.tag).filter(t=>t&&t.trim()))];
  if(!tags.length){ document.getElementById('tagCloud').style.display='none'; return; }
  const cloud = document.getElementById('tagCloud');
  cloud.innerHTML =
    `<span class="tag-cloud-label">TAG:</span>` +
    tags.map(t=>`<button type="button" class="tag-pill${currentTag===t?' active':''}" data-tag="${escapeHTML(t)}"># ${escapeHTML(t)}</button>`).join('');
  cloud.querySelectorAll('.tag-pill').forEach(btn=>btn.addEventListener('click', ()=>filterTag(btn.dataset.tag || '')));
}

// タグ絞り込み
function filterTag(tag){
  if(currentTag === tag){
    clearFilter();
    return;
  }
  currentTag = tag;
  currentCat = 'all';
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.cat-tab')[0].classList.add('active');
  document.getElementById('filterBar').classList.add('show');
  document.getElementById('filterLabel').textContent = `タグ「${tag}」で絞り込み中`;
  renderArticles(currentCat, currentTag);
  renderTagCloud();
}

// 絞り込み解除
function clearFilter(){
  currentTag = '';
  document.getElementById('filterBar').classList.remove('show');
  renderArticles(currentCat, currentTag);
  renderTagCloud();
}

function renderArticles(cat, tag){
  const grid = document.getElementById('blogGrid');
  let filtered = cat==='all' ? articles : articles.filter(a=>a.cat===cat);
  if(tag) filtered = filtered.filter(a=>a.tag===tag);

  if(!filtered.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--gray);padding:60px;font-size:0.85rem;">記事が見つかりませんでした</div>';
    return;
  }

  grid.innerHTML = filtered.map(a=>{
    const imageUrl = safeImageUrl(a.image);
    return `
    <div class="blog-card fi" role="button" tabindex="0" data-article-id="${escapeHTML(String(a.id))}">
      <div class="blog-thumb">
        ${imageUrl
          ? `<img src="${escapeHTML(imageUrl)}" alt="${escapeHTML(a.title)}" loading="lazy">`
          : `<div class="blog-thumb-placeholder">${escapeHTML(a.emoji||'📝')}</div>`}
        <span class="blog-cat">${escapeHTML(a.cat)}</span>
      </div>
      <div class="blog-body">
        <span class="blog-date">${escapeHTML(a.date)}</span>
        <h3 class="blog-title">${escapeHTML(a.title)}</h3>
        <p class="blog-excerpt">${escapeHTML(a.excerpt||'')}</p>
        <div class="blog-footer">
          ${a.tag ? `<button type="button" class="blog-tag" data-tag="${escapeHTML(a.tag)}"># ${escapeHTML(a.tag)}</button>` : '<span></span>'}
          <span class="blog-arrow">→</span>
        </div>
      </div>
    </div>
  `}).join('');

  grid.querySelectorAll('.blog-card').forEach(card=>{
    const open = ()=>openModal(card.dataset.articleId || '');
    card.addEventListener('click', open);
    card.addEventListener('keydown', event=>{
      if(event.key==='Enter'||event.key===' '){ event.preventDefault(); open(); }
    });
  });
  grid.querySelectorAll('.blog-tag').forEach(btn=>btn.addEventListener('click', event=>{
    event.stopPropagation();
    filterTag(btn.dataset.tag || '');
  }));

  setTimeout(()=>{
    document.querySelectorAll('.fi').forEach(el=>{ obs.observe(el); });
  },50);
}

function filterCat(cat, btn){
  currentCat = cat;
  currentTag = '';
  document.getElementById('filterBar').classList.remove('show');
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderArticles(cat, '');
  renderTagCloud();
}

function openModal(id){
  const a = articles.find(x=>String(x.id)===String(id));
  if(!a) return;
  const imageUrl = safeImageUrl(a.image);
  document.getElementById('modalImg').innerHTML = imageUrl
    ? `<img class="modal-img" src="${escapeHTML(imageUrl)}" alt="${escapeHTML(a.title)}">`
    : `<div class="modal-img-placeholder">${escapeHTML(a.emoji||'📝')}</div>`;
  document.getElementById('modalCat').textContent = a.cat;
  document.getElementById('modalDate').textContent = a.date;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalBody').innerHTML = sanitizeArticleHTML(a.body);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay')){
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow='';
  }
}

function closeModalBtn(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}

function toggleMenu(){document.getElementById('mobileMenu').classList.toggle('open');}

const obs=new IntersectionObserver(entries=>{entries.forEach((e,i)=>{if(e.isIntersecting)setTimeout(()=>e.target.classList.add('v'),i*80);});},{threshold:0.05});

// 初期表示
loadArticles();
document.querySelectorAll('.fi').forEach(el=>obs.observe(el));

</script>
