name: One-shot enforce navigation accessibility

on:
  push:
    branches:
      - ci/enforce-navigation-accessibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/enforce-navigation-accessibility
      - name: Promote known UX warnings to errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_site.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'WARNINGS.append(f"{relative_path}: プレースホルダーリンク href=\\\"#\\\" があります")': 'error(f"{relative_path}: プレースホルダーリンク href=\\\"#\\\" があります")',
              'WARNINGS.append(f"{page}: menu-btn に aria-label がありません")': 'error(f"{page}: menu-btn に aria-label がありません")',
              'WARNINGS.append(f"{page}: menu-btn に aria-controls がありません")': 'error(f"{page}: menu-btn に aria-controls がありません")',
              'WARNINGS.append(f"{page}: menu-btn に aria-expanded がありません")': 'error(f"{page}: menu-btn に aria-expanded がありません")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected check not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-enforce-nav-a11y.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_site.py .github/workflows/one-shot-enforce-nav-a11y.yml
          git diff --cached --check
          git commit -m "ci: enforce navigation and menu accessibility"
          git push origin HEAD:ci/enforce-navigation-accessibility
