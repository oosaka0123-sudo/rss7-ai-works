name: Configure Eging Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eging-runtime-setup
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out eging main
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/eging
          ref: main
          path: eging
          persist-credentials: false

      - name: Validate required secrets
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          DB_HOST: ${{ vars.EGING_DB_HOST }}
          DB_NAME: ${{ vars.EGING_DB_NAME }}
          DB_USER: ${{ vars.EGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.EGING_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          set +x
          for v in FTP_HOST FTP_USER FTP_PASSWORD DB_HOST DB_NAME DB_USER DB_PASSWORD ADMIN_PASSWORD_HASH; do
            [[ -n "${!v}" ]] || { echo "Missing required secret: $v"; exit 1; }
          done
          case "$ADMIN_PASSWORD_HASH" in
            '$2y$'*|'$2b$'*|'$argon2id$'*) ;;
            *) echo "EGING_ADMIN_PASSWORD_HASH is not a password_hash() value."; exit 1 ;;
          esac

      - name: Validate PHP schema
        run: |
          find eging -name '*.php' -not -path '*/.git/*' -print0 | xargs -0 -n1 php -l
          test -f eging/database/schema.sql

      - name: Install clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli

      - name: Note Lolipop database boundary
        run: |
          echo "Lolipop MySQL host is private to the hosting network."
          echo "This workflow only uploads runtime config. Schema installation runs on Lolipop via /admin/install.php."

      - name: Build private runtime config
        shell: bash
        env:
          DB_HOST: ${{ vars.EGING_DB_HOST }}
          DB_NAME: ${{ vars.EGING_DB_NAME }}
          DB_USER: ${{ vars.EGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.EGING_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          umask 077
          php -r '
          $cfg = [
            "app_url" => "https://eging.rss7.net",
            "db" => [
              "host" => getenv("DB_HOST"),
              "port" => 3306,
              "name" => getenv("DB_NAME"),
              "user" => getenv("DB_USER"),
              "pass" => getenv("DB_PASSWORD"),
            ],
            "admin_password_hash" => getenv("ADMIN_PASSWORD_HASH"),
          ];
          file_put_contents("/tmp/eging-config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '
          php -l /tmp/eging-config.php

      - name: Upload config outside web root
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
        run: |
          set -euo pipefail
          set +x
          PORT="${FTP_PORT:-21}"

          if ! lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set net:max-retries 1;
            set net:timeout 15;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            cd /eging-private/config;
            bye;
          " >/dev/null 2>&1; then
            lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" -e "
              set cmd:fail-exit yes;
              set net:max-retries 1;
              set net:timeout 15;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              cd /eging-private;
              mkdir config;
              bye;
            "
          fi

          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put /tmp/eging-config.php -o /eging-private/config/config.php
          bye
          LFTP
          rm -f /tmp/eging-config.php

      - name: Diagnose Lolipop runtime safely
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
        run: |
          set -euo pipefail
          set +x
          PORT="${FTP_PORT:-21}"
          cat > /tmp/eging-runtime-check.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          $result = ['runtime' => false, 'config' => false, 'db' => false];
          try {
              require __DIR__ . '/_runtime.php';
              $root = eging_private_root();
              $result['runtime'] = is_file($root . '/app/bootstrap.php');
              $result['config'] = is_file($root . '/config/config.php');
              eging_require_bootstrap();
              $result['db'] = isset($pdo) && $pdo instanceof PDO;
          } catch (Throwable $e) {
              $result['error_class'] = get_class($e);
              $result['error_code'] = (string)$e->getCode();
              $previous = $e->getPrevious();
              if ($previous instanceof Throwable) {
                  $result['previous_class'] = get_class($previous);
                  $result['previous_code'] = (string)$previous->getCode();
                  if ($previous instanceof PDOException && is_array($previous->errorInfo ?? null)) {
                      $result['sqlstate'] = (string)($previous->errorInfo[0] ?? '');
                      $result['driver_code'] = (string)($previous->errorInfo[1] ?? '');
                  }
              }
          }
          echo json_encode($result, JSON_UNESCAPED_SLASHES);
          PHP

          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put /tmp/eging-runtime-check.php -o /eging/__runtime-check.php
          bye
          LFTP

          status="$(curl --silent --output /tmp/runtime-check.json --write-out '%{http_code}' https://eging.rss7.net/__runtime-check.php)"
          cat /tmp/runtime-check.json
          echo
          echo "Runtime diagnostic HTTP: $status"

          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          rm /eging/__runtime-check.php
          bye
          LFTP
          test "$status" = "200"

      - name: Verify dynamic runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://eging.rss7.net"
          admin_status="$(curl --silent --output /tmp/admin.html --write-out '%{http_code}' "$BASE/admin/login.php")"
          [[ "$admin_status" == "200" ]] || { echo "Admin login returned $admin_status"; exit 1; }
          grep -Fq "エギングギアラボ CMS" /tmp/admin.html

          health_status="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' "$BASE/health.php")"
          [[ "$health_status" == "200" ]] || { echo "Health endpoint returned $health_status"; exit 1; }
          grep -Fq '"ok":true' /tmp/health.json

          echo "Eging runtime config is uploaded. Run /admin/install.php after admin login to initialize schema."
