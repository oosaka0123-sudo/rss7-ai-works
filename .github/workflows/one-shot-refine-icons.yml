name: One-shot refine premium icons

on:
  push:
    branches: ["design/95point-phase1"]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace emoji icons with inline technical SVGs
        run: |
          python - <<'PY'
          from pathlib import Path

          icons = {
            '🌐': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4.5" y="6.5" width="23" height="19" rx="1.5"/><path d="M4.5 11.5h23M9 9h.01M12 9h.01M15 9h.01M9 16h6M9 20h10"/></svg>',
            '📱': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3.5" width="14" height="25" rx="2"/><path d="M13 7h6M14.5 24.5h3"/></svg>',
            '🎬': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="10" width="22" height="16" rx="1.5"/><path d="M5 10l3-5h5l-3 5m5 0 3-5h5l-3 5M13.5 15l6 3.5-6 3.5z"/></svg>',
            '🤖': '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v4M13 4h6M8 11h16v13H8zM4.5 15v5M27.5 15v5"/><circle cx="12" cy="16" r="1"/><circle cx="20" cy="16" r="1"/><path d="M12 21h8"/></svg>',
            '📽️': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="8" width="18" height="16" rx="1.5"/><circle cx="11" cy="14" r="2.5"/><circle cx="18" cy="14" r="2.5"/><path d="M9 21h10M23 13l4-2v10l-4-2"/></svg>',
            '📊': '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26h22M8 23v-7h4v7M14 23V10h4v13M20 23V6h4v17"/></svg>',
            '🎵': '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M14 22V8l11-2v13M14 11l11-2"/><circle cx="10.5" cy="23" r="3.5"/><circle cx="21.5" cy="20" r="3.5"/></svg>',
            '📧': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4.5" y="7.5" width="23" height="17" rx="1.5"/><path d="M5 9l11 8 11-8M5 23l7.5-7M27 23l-7.5-7"/></svg>',
            '🧭': '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path d="M20.5 11.5l-3 7-7 3 3-7z"/><circle cx="16" cy="16" r="1"/></svg>',
            '🔍': '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="8"/><path d="M20 20l6 6M10 14h8M14 10v8"/></svg>',
            '✅': '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="2"/><path d="M10 16.5l4 4 8-9"/></svg>',
          }

          for filename in ('index.html', 'services.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for emoji, svg in icons.items():
                  text = text.replace(f'<span class="s-icon">{emoji}</span>', f'<span class="s-icon">{svg}</span>')
                  text = text.replace(f'<div class="sd-icon">{emoji}</div>', f'<div class="sd-icon">{svg}</div>')

              if filename == 'index.html':
                  old = ".s-icon{font-size:2.2rem;margin-bottom:18px;display:block;filter:grayscale(0.3);}"
                  new = ".s-icon{width:42px;height:42px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:var(--blue);}.s-icon svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(0,170,255,0.10));transition:transform .3s ease,stroke .3s ease}.service-card:hover .s-icon svg{transform:translateY(-2px);stroke:var(--cyan)}"
                  assert old in text, 'index s-icon CSS marker missing'
                  text = text.replace(old, new, 1)
              else:
                  old = ".sd-icon{font-size:2.5rem;}"
                  new = ".sd-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--blue);flex:0 0 46px}.sd-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(0,170,255,0.10))}"
                  assert old in text, 'services sd-icon CSS marker missing'
                  text = text.replace(old, new, 1)

              p.write_text(text, encoding='utf-8')

          # Ensure service/team emoji markers are gone from the intended icon slots.
          all_text = Path('index.html').read_text(encoding='utf-8') + Path('services.html').read_text(encoding='utf-8')
          for emoji in icons:
              assert f'class="s-icon">{emoji}' not in all_text
              assert f'class="sd-icon">{emoji}' not in all_text
          PY
      - name: Validate icon refinement
        run: |
          python scripts/check_site.py
          node scripts/check_inline_js.mjs
          python scripts/check_service_contact_contract.py
          git diff --check
          grep -q 'class="s-icon"><svg' index.html
          grep -q 'class="sd-icon"><svg' services.html
      - name: Commit icon system and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-refine-icons.yml
          git add index.html services.html .github/workflows/one-shot-refine-icons.yml
          git diff --cached --check
          git commit -m "refactor: replace emoji icons with technical SVG system"
          git push origin HEAD:design/95point-phase1
