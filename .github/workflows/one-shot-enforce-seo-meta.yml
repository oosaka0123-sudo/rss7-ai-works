name: One-shot enforce main page SEO metadata

on:
  push:
    branches:
      - ci/enforce-main-page-seo-meta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/enforce-main-page-seo-meta
      - name: Add main page metadata checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_site.py')
          text = path.read_text(encoding='utf-8')
          marker = '''        if 'content="https://rss7.net/images/og-image.jpg"' not in text:\n            error(f"{page}: og:imageがありません")\n'''
          addition = '''        if 'content="https://rss7.net/images/og-image.jpg"' not in text:\n            error(f"{page}: og:imageがありません")\n        if not re.search(r"<title>\\s*[^<]+\\s*</title>", text, flags=re.I):\n            error(f"{page}: titleがありません")\n        if not re.search(r'<meta\\s+name=["\\\']description["\\\']\\s+content=["\\\'][^"\\\']+["\\\']', text, flags=re.I):\n            error(f"{page}: meta descriptionがありません")\n        if not re.search(r'<meta\\s+name=["\\\']robots["\\\']\\s+content=["\\\'][^"\\\']+["\\\']', text, flags=re.I):\n            error(f"{page}: robots metaがありません")\n        for prop in ("og:title", "og:description", "og:type"):\n            if not re.search(rf'<meta\\s+property=["\\\']{re.escape(prop)}["\\\']\\s+content=["\\\'][^"\\\']+["\\\']', text, flags=re.I):\n                error(f"{page}: {prop} がありません")\n        if f'<meta property="og:url" content="{canonical}"' not in text:\n            error(f"{page}: og:urlが不一致です")\n'''
          if marker not in text:
              raise SystemExit('metadata insertion marker not found')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-enforce-seo-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_site.py .github/workflows/one-shot-enforce-seo-meta.yml
          git diff --cached --check
          git commit -m "ci: enforce SEO metadata on main pages"
          git push origin HEAD:ci/enforce-main-page-seo-meta
