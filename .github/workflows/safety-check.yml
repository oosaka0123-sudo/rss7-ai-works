name: AI safety gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Block accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if printf '%s\n' "$changed" | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$)' ; then
            echo "Secret-like file detected. Do not commit credentials or private keys."
            exit 1
          fi

      - name: Scan added lines for obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          added="$(git diff -U0 "origin/${{ github.base_ref }}...HEAD" | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$added" | grep -E -- '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' ; then
            echo "Possible credential detected in added lines."
            exit 1
          fi

      - name: Protect generated state files
        if: ${{ !startsWith(github.head_ref, 'automation/state-') }}
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- PROJECT_STATE.json STATUS.md || true)"
          if [ -n "$changes" ]; then
            forbidden="$(printf '%s\n' "$changes" | awk '$1 != "A" {print}')"
            if [ -n "$forbidden" ]; then
              echo "PROJECT_STATE.json and STATUS.md are Actions-owned after bootstrap."
              printf '%s\n' "$forbidden"
              exit 1
            fi
          fi

      - name: Require human approval for high-risk changes
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          names="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          statuses="$(git diff --name-status "origin/${{ github.base_ref }}...HEAD")"
          high_risk=0

          if printf '%s\n' "$names" | grep -E '(^|/)\.htaccess$|^api/|^\.github/workflows/' >/dev/null; then
            high_risk=1
          fi
          if printf '%s\n' "$statuses" | grep '^D' >/dev/null; then
            high_risk=1
          fi

          if [ "$high_risk" -eq 1 ]; then
            if [[ ",$PR_LABELS," != *",needs-human-approval,"* ]] && [[ "$PR_TITLE" != *"[HUMAN-APPROVAL]"* ]]; then
              echo "High-risk change detected. Add needs-human-approval label or use [HUMAN-APPROVAL] in the PR title."
              exit 1
            fi
          fi

      - name: Limit unexpectedly large changed files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            size=$(wc -c < "$file")
            if [ "$size" -gt 5242880 ]; then
              echo "Changed file exceeds 5 MiB: $file"
              exit 1
            fi
          done < <(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD")
