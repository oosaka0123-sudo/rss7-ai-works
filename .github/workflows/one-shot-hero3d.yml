name: One-shot hero 3D motion

on:
  push:
    branches: ["fix/hero-3d-motion"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-3d-motion
      - name: Apply subtle 3D hero motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.hero-visual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}\n.hero-visual img{width:min(1100px,150vw);max-width:none;opacity:0.55;mix-blend-mode:screen;}\n@media(max-width:768px){.hero-visual img{width:min(900px,220vw);opacity:0.4;}}'
          new = '.hero-visual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;perspective:1000px;overflow:hidden;}\n.hero-visual img{width:min(1100px,150vw);max-width:none;opacity:0.24;mix-blend-mode:screen;transform-style:preserve-3d;will-change:transform,opacity;animation:heroDepth 18s ease-in-out infinite alternate;filter:drop-shadow(0 10px 26px rgba(0,170,255,0.08));}\n@keyframes heroDepth{0%{transform:translate3d(-1.8%,-0.8%,18px) rotateX(2.2deg) rotateY(-3deg) scale(1.04);opacity:0.20;}50%{transform:translate3d(0.8%,0.6%,42px) rotateX(-1deg) rotateY(1.8deg) scale(1.07);opacity:0.26;}100%{transform:translate3d(1.8%,-0.2%,22px) rotateX(1.4deg) rotateY(3deg) scale(1.04);opacity:0.22;}}\n@media(max-width:768px){.hero-visual{perspective:800px;}.hero-visual img{width:min(900px,220vw);opacity:0.18;animation-duration:22s;}}\n@media(prefers-reduced-motion:reduce){.hero-visual img{animation:none;transform:none;opacity:0.20;}}'
          if old not in s:
              raise SystemExit('target hero CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-hero3d.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-hero3d.yml
          git diff --cached --check
          git commit -m "style: add subtle 3D motion to hero network"
          git push origin HEAD:fix/hero-3d-motion
