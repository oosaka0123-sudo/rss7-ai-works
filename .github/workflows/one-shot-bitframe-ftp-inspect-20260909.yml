name: One-shot BitFrame legacy service deploy

on:
  push:
    branches:
      - ops/bitframe-ftp-inspect-20260909

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
    steps:
      - name: Checkout BitFrame main
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/bitframe
          ref: main
          persist-credentials: false
      - name: Verify compatibility page
        run: |
          set -euo pipefail
          test -f service/index.html
          grep -Fq '<base href="/">' service/index.html
          grep -Fq 'https://bitframe.rss7.net/service.html' service/index.html
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload only legacy service compatibility directory
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          mkdir /bitframe/service
          mirror --reverse --verbose=1 --no-perms ./service/ /bitframe/service/
          bye
          LFTP
          echo LEGACY_SERVICE_DEPLOY_COMPLETE
