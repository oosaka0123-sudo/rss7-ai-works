name: One-shot BitFrame cache inspect

on:
  push:
    branches:
      - ops/bitframe-ftp-inspect-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Inspect cache directories only
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          for p in /bitframe/wp-content/cache /bitframe/wp-content/cache/wpo-cache /bitframe/wp-content/cache/page_enhanced /bitframe/wp-content/wpo-cache; do
            echo "PATH=$p"
            lftp -c "
              set cmd:fail-exit no;
              set net:max-retries 2;
              set net:timeout 20;
              set ssl:verify-certificate yes;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT\";
              cls -1 \"$p\";
            " 2>/dev/null | sed -E 's#^/bitframe/wp-content/#wp-content/#' | grep -E '^[A-Za-z0-9._/-]+$' | head -80 || true
          done
          echo CACHE_INSPECTION_COMPLETE
