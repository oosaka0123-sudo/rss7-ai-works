name: One-shot BitFrame production preflight

on:
  push:
    branches:
      - ops/bitframe-ftp-inspect-20260909

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Clean isolated probe and inspect conflicts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          listing="$(lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT\";
            cls -1 /bitframe;
            rm -r /bitframe/_directoryindex-probe;
          ")"
          for name in index.html works.html service.html flow-price.html contact.html assets; do
            if printf '%s\n' "$listing" | sed 's#/$##' | grep -Eq "(^|/)$name$"; then
              echo "CONFLICT_${name//[^A-Za-z0-9]/_}=YES"
            else
              echo "CONFLICT_${name//[^A-Za-z0-9]/_}=NO"
            fi
          done
          echo "PROBE_CLEANED=YES"
          echo "PREFLIGHT_COMPLETE"
