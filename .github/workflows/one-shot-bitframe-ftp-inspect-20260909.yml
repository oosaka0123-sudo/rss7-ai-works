name: One-shot BitFrame DirectoryIndex probe

on:
  push:
    branches:
      - ops/bitframe-ftp-inspect-20260909

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Create isolated probe only
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/bitframe-probe
          printf '%s' 'BITFRAME_INDEX_HTML_WINS' > /tmp/bitframe-probe/index.html
          printf '%s' '<?php echo "BITFRAME_INDEX_PHP_WINS"; ?>' > /tmp/bitframe-probe/index.php
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          mkdir /bitframe/_directoryindex-probe
          mirror --reverse --verbose=1 --no-perms /tmp/bitframe-probe/ /bitframe/_directoryindex-probe/
          bye
          LFTP
          echo "PROBE_READY"
