name: One-shot resync sitemap JST

on:
  push:
    branches: [ux/services-process-faq]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[jst-sync-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ux/services-process-faq
      - name: Synchronize sitemap in JST
        env:
          SITEMAP_GIT_REF: HEAD
        run: |
          python scripts/sync_sitemap_lastmod.py
          python scripts/sync_sitemap_lastmod.py --check
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-resync-sitemap-jst.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml .github/workflows/one-shot-resync-sitemap-jst.yml
          git commit -m "fix: resync sitemap dates in JST [jst-sync-complete]"
          git push origin ux/services-process-faq
