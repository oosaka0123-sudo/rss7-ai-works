name: Site quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sitemap lastmod freshness
        env:
          SITEMAP_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/sync_sitemap_lastmod.py --check
      - name: Validate public site
        run: python scripts/check_site.py
      - name: Validate service-to-contact contract
        run: python scripts/check_service_contact_contract.py
      - name: Validate inline JavaScript syntax
        run: node scripts/check_inline_js.mjs
      - name: Validate PHP syntax
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
