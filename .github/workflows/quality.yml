name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public site
        run: python scripts/check_site.py
      - name: Validate inline JavaScript syntax
        run: node scripts/check_inline_js.mjs
      - name: Validate PHP syntax
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
