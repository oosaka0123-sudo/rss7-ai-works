name: Deploy static demos

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - ".github/workflows/deploy-static-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss7-static-demos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
      DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
      SITE_URL: ${{ vars.LOLIPOP_SITE_URL }}
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate static-demo deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PASSWORD" ]] \
            || { echo "Deployment secrets are incomplete."; exit 1; }
          [[ "$DEPLOY_SCHEME" =~ ^(ftp|ftps)$ ]] \
            || { echo "FTP scheme is invalid."; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] \
            || { echo "FTP port is invalid."; exit 1; }
          [[ "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]*$ && "$DEPLOY_DIR" != *".."* ]] \
            || { echo "Deployment directory is invalid."; exit 1; }
          [[ "$SITE_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]] \
            || { echo "Site URL is invalid."; exit 1; }
          test -f demos/nyoganji/index.html \
            || { echo "Nyoganji demo entry point is missing."; exit 1; }

      - name: Install deployment tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload isolated demos directory
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          remote_demos="${DEPLOY_DIR%/}/demos"
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          mkdir -p "$remote_demos"
          mirror --reverse --verbose=1 --parallel=2 --no-perms --delete ./demos/ "$remote_demos/"
          bye
          LFTP

      - name: Verify Nyoganji demo
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/demos/nyoganji"
          for page in index.html history.html experience.html stay.html memorial.html events.html access.html; do
            curl --fail --silent --show-error "$base/$page" >/tmp/nyoganji-page.html
          done
          curl --fail --silent --show-error "$base/index.html" \
            | grep -Fq '霊峰山 如願寺'
          echo "Nyoganji 7-page demo is live at $base/"
