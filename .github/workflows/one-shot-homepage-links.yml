name: One-shot homepage service link fix

on:
  push:
    branches:
      - fix/homepage-service-links

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-service-links
      - name: Apply minimal UX fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('href="#" class="logo"', 'href="/" class="logo"', 2)
          targets = {
              'WEB制作': 'services.html#web-development',
              'アプリ開発': 'services.html#app-development',
              'AI動画CM制作': 'services.html#ai-video',
              'AI導入コンサル': 'services.html#ai-consulting',
          }
          for label, href in targets.items():
              pattern = rf'<a href="#"([^>]*)>{re.escape(label)}</a>'
              text, count = re.subn(pattern, rf'<a href="{href}"\1>{label}</a>', text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one footer link for {label}, got {count}')
          old_button = '<button class="menu-btn" onclick="toggleMenu()" aria-label="メニュー">'
          new_button = '<button class="menu-btn" onclick="toggleMenu();this.setAttribute(\'aria-expanded\',document.getElementById(\'mobileMenu\').classList.contains(\'open\')?\'true\':\'false\')" aria-label="メニュー" aria-controls="mobileMenu" aria-expanded="false">'
          if old_button not in text:
              raise SystemExit('index menu button pattern not found')
          text = text.replace(old_button, new_button, 1)
          index.write_text(text, encoding='utf-8')

          services = Path('services.html')
          text = services.read_text(encoding='utf-8')
          ids = ['web-development', 'app-development', 'ai-video', 'ai-consulting']
          for service_id in ids:
              old = '<div class="service-detail">'
              new = f'<div class="service-detail" id="{service_id}">'
              if old not in text:
                  raise SystemExit(f'service detail pattern missing before {service_id}')
              text = text.replace(old, new, 1)
          text = text.replace('.service-detail{margin-bottom:80px;}', '.service-detail{margin-bottom:80px;scroll-margin-top:100px;}', 1)
          old_button = '<button class="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></button>'
          new_button = '<button class="menu-btn" onclick="toggleMenu();this.setAttribute(\'aria-expanded\',document.getElementById(\'mobileMenu\').classList.contains(\'open\')?\'true\':\'false\')" aria-label="メニュー" aria-controls="mobileMenu" aria-expanded="false"><span></span><span></span><span></span></button>'
          if old_button not in text:
              raise SystemExit('services menu button pattern not found')
          text = text.replace(old_button, new_button, 1)
          services.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit branch changes
        run: |
          rm .github/workflows/one-shot-homepage-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html .github/workflows/one-shot-homepage-links.yml
          git diff --cached --check
          git commit -m "fix: repair homepage service navigation and menu aria"
          git push origin HEAD:fix/homepage-service-links
