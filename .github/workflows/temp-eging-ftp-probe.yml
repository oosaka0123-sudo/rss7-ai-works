name: Temporary eging FTP probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify /eging is the subdomain document root
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
        run: |
          set -euo pipefail
          set +x
          scheme="${FTP_SCHEME:-ftp}"
          port="${FTP_PORT:-21}"
          marker="EGING_DOCROOT_PROBE_${GITHUB_RUN_ID}"
          printf '%s\n' "$marker" > /tmp/__eging_docroot_probe.txt

          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$scheme://$FTP_HOST:$port\";
            put /tmp/__eging_docroot_probe.txt -o /eging/__eging_docroot_probe.txt;
          "

          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --max-time 20 "https://eging.rss7.net/__eging_docroot_probe.txt?run=$GITHUB_RUN_ID" || true)"
            if [[ "$body" == "$marker" ]]; then
              echo "DOCROOT_CONFIRMED /eging"
              exit 0
            fi
            sleep 3
          done

          echo "DOCROOT_NOT_CONFIRMED /eging"
          exit 1

      - name: Remove temporary probe
        if: always()
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
        run: |
          set +e
          scheme="${FTP_SCHEME:-ftp}"
          port="${FTP_PORT:-21}"
          lftp -c "
            set net:max-retries 1;
            set net:timeout 15;
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$scheme://$FTP_HOST:$port\";
            rm -f /eging/__eging_docroot_probe.txt;
          "
          rm -f /tmp/__eging_docroot_probe.txt
          echo "Temporary probe cleanup attempted."
