name: Sync project state

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'automation/state-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update PROJECT_STATE and STATUS
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          state_path = Path('PROJECT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          current = state.setdefault('current', {})

          if os.environ.get('EVENT_NAME') == 'pull_request':
              current['last_merged_pr'] = int(os.environ['PR_NUMBER'])
              current['last_merged_commit'] = os.environ.get('MERGE_SHA') or None
              current['status'] = 'idle'
              current['active_issue'] = None
              current['blocked_reason'] = None

          state['updated_at'] = datetime.now(timezone.utc).isoformat()
          state['updated_by'] = 'github-actions'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          agents = state.get('agents', {})
          automation = state.get('automation', {})
          current = state.get('current', {})

          def onoff(value):
              return 'ON' if value else 'OFF'

          lines = [
              '# RSS7 AI Works Status',
              '',
              '> このファイルは `PROJECT_STATE.json` からGitHub Actionsが生成する読み取り専用サマリーです。手動編集しません。',
              '',
              f"- Phase: `{state.get('phase', 'unknown')}`",
              f"- Status: `{current.get('status', 'unknown')}`",
              f"- Primary implementation agent: `{agents.get('primary_implementation', 'unknown')}`",
              f"- Review: `{agents.get('review', 'unknown')}`",
              f"- Mechanical checks: `{agents.get('mechanical_checks', 'unknown')}`",
              f"- Fallback implementation: `{agents.get('fallback_implementation', 'unknown')}`",
              f"- Auto merge: `{onoff(automation.get('auto_merge', False))}`",
              f"- Auto deploy: `{onoff(automation.get('auto_deploy', False))}`",
              f"- Production verification: `{onoff(automation.get('production_verification', False))}`",
              f"- Automatic rollback: `{onoff(automation.get('automatic_rollback', False))}`",
              f"- Active issue: `{current.get('active_issue') or 'none'}`",
              f"- Last merged PR: `{current.get('last_merged_pr') or 'none'}`",
              f"- Last merged commit: `{current.get('last_merged_commit') or 'none'}`",
              f"- Last verified commit: `{current.get('last_verified_commit') or 'none'}`",
              f"- Blocked reason: `{current.get('blocked_reason') or 'none'}`",
              '',
              '## Goal',
              '',
              state.get('goal', ''),
              '',
          ]
          Path('STATUS.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Create Actions-owned state PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_STATE.json STATUS.md; then
            echo "No state change."
            exit 0
          fi

          branch="automation/state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add PROJECT_STATE.json STATUS.md
          git commit -m "chore: sync project state"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync project state" \
            --body "Automated state snapshot generated by GitHub Actions. Do not edit manually.")

          gh pr edit "$pr_url" --add-label "risk:low" || true
          gh pr merge "$pr_url" --squash --auto || echo "Auto-merge is currently unavailable; state PR remains open."
