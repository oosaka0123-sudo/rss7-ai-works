name: Lolipop FTPS Connection Test

on:
  push:
    branches:
      - test/lolipop-ftps-connection-20260906

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
      DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Validate config and test FTPS login only
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PASSWORD" ]] || { echo "::error::Lolipop FTP secrets are incomplete."; exit 1; }
          [[ "$DEPLOY_SCHEME" =~ ^(ftp|ftps)$ ]] || { echo "::error::FTP scheme is invalid."; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::FTP port is invalid."; exit 1; }
          [[ "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]*$ && "$DEPLOY_DIR" != *".."* ]] || { echo "::error::Deployment directory is invalid."; exit 1; }

          lftp <<LFTP_EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          cd "$DEPLOY_DIR"
          pwd
          cls -1 | head -n 5
          bye
          LFTP_EOF

          echo "Lolipop FTPS authentication and read-only directory access succeeded."
          echo "No upload, delete, mirror, rename, mkdir, or file modification was performed."
