name: One-shot BitFrame final SEO deploy

on:
  push:
    branches:
      - ops/bitframe-ftp-inspect-20260909

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SCHEME: ${{ vars.LOLIPOP_FTP_SCHEME }}
      DEPLOY_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
    steps:
      - name: Checkout BitFrame main
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/bitframe
          ref: main
          persist-credentials: false
      - name: Verify final index
        run: |
          set -euo pipefail
          grep -Fq 'google-site-verification' index.html
          grep -Fq 'つくる速度を、' index.html
          if grep -Fq 'noindex,nofollow' index.html; then exit 1; fi
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload final index only
        env:
          DEPLOY_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          DEPLOY_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          open -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_SCHEME://$DEPLOY_HOST:$DEPLOY_PORT"
          put -O /bitframe index.html
          bye
          LFTP
      - name: Verify production
        run: |
          set -euo pipefail
          ts=$(date +%s)
          curl -fsS "https://bitframe.rss7.net/?final=$ts" | grep -Fq 'google-site-verification'
          curl -fsS "https://bitframe.rss7.net/?final=$ts" | grep -Fq 'つくる速度を、'
          echo BITFRAME_FINAL_SEO_OK
