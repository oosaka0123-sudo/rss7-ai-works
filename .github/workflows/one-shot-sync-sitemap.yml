name: One-shot sitemap lastmod synchronization

on:
  push:
    branches:
      - seo/automate-sitemap-lastmod

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/automate-sitemap-lastmod
          fetch-depth: 0
      - name: Synchronize sitemap with Git history
        run: python scripts/sync_sitemap_lastmod.py
      - name: Remove one-shot workflow and commit synchronized sitemap
        run: |
          rm .github/workflows/one-shot-sync-sitemap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml .github/workflows/one-shot-sync-sitemap.yml
          git diff --cached --check
          git commit -m "seo: synchronize sitemap lastmod with Git history"
          git push origin HEAD:seo/automate-sitemap-lastmod
