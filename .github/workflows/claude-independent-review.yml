name: Claude Independent Issue Review

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: claude-independent-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude-review')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Anthropic authentication availability
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ] && [ "$HAS_OAUTH_TOKEN" != "true" ]; then
            echo "::error::Claude authentication is not configured for this repository. Configure either ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a GitHub Actions secret before triggering @claude-review."
            exit 1
          fi
          echo "A supported Claude authentication method is configured. Secret values are not printed."

      - name: Run Claude independent review
        uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |-
            You are Claude Code acting strictly as an independent reviewer for the RSS7 AI Works GitHub Issue that received the triggering @claude-review comment.

            ANALYSIS-ONLY MODE is mandatory.
            - Do not create, modify, move, or delete repository files.
            - Do not create or modify branches, commits, pull requests, releases, deployments, Secrets, Variables, environments, or server files.
            - Do not trigger or re-run production deployment.
            - Do not expose or request secret values.

            Review the CURRENT TRIGGERING ISSUE, not a previously reviewed issue.
            1. Read the triggering Issue title, body, and all current comments, including the owner's @claude-review instructions.
            2. Read AGENTS.md, PROJECT_SPEC.md, README.md, and only the project files/workflows relevant to that Issue.
            3. Inspect current main and relevant recent PRs/commits when they materially affect the Issue.
            4. Treat current GitHub state as SSOT and separate OBSERVED facts from HYPOTHESIS.
            5. Focus only on the scope and priorities requested by the triggering Issue/comment. Do not reuse a hard-coded production-deploy review checklist unless the triggering Issue is actually about production deployment.

            Post a concise, actionable review to the triggering Issue using these headings:
            OBSERVED
            ASSESSMENT
            RISKS / BLOCKERS
            MINIMAL FIX PLAN
            GO / NO-GO

            If evidence is insufficient, say exactly what is missing. Do not invent success or unrelated tasks.
          claude_args: '--model sonnet --max-turns 24 --allowed-tools "Bash"'
